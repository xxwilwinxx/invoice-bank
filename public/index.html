<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Bank Storage System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #222; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 10px; font-size: 16px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-ocr { background: #007bff; margin-bottom: 15px; }
        .btn-ocr:hover { background: #0056b3; }
        .link-files { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
        .link-files:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Invoice Bank Storage System</h2>
        
        <div class="form-group">
            <label for="invoiceFile">Choose File</label>
            <input type="file" id="invoiceFile" name="invoice">
        </div>
        <button type="button" id="autoFillBtn" class="btn-ocr">⚡ Auto-Fill from File</button>

        <form id="invoiceForm">
            <div class="form-group">
                <label for="client">Client Name</label>
                <input type="text" id="client" name="client" placeholder="Client Name" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" step="0.01" id="amount" name="amount" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="fileName">File Reference / Name</label>
                <input type="text" id="fileName" name="fileName" placeholder="File Reference">
            </div>
            <button type="submit">+ Save Invoice</button>
        </form>
        <a class="link-files" href="/files">→ View All Uploaded Invoices & Files</a>
    </div>

    <script>
        document.getElementById('autoFillBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('invoiceFile');
            if (!fileInput.files[0]) {
                alert('Please choose a file first before clicking Auto-Fill.');
                return;
            }

            const formData = new FormData();
            formData.append('invoice', fileInput.files[0]);

            document.getElementById('autoFillBtn').innerText = 'Scanning...';

            try {
                const response = await fetch('/api/extract-invoice', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    if (data.amount) document.getElementById('amount').value = data.amount;
                    if (data.date) document.getElementById('date').value = data.date;
                    document.getElementById('fileName').value = fileInput.files[0].name;
                    alert('Scan complete!');
                } else {
                    alert('Scan failed: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('OCR Error:', err);
                alert('Failed to connect to scanner API.');
            } finally {
                document.getElementById('autoFillBtn').innerText = '⚡ Auto-Fill from File';
            }
        });

        document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('invoiceFile');
            const formData = new FormData();
            if (fileInput.files[0]) {
                formData.append('invoice', fileInput.files[0]);
            }
            formData.append('client', document.getElementById('client').value);
            formData.append('amount', document.getElementById('amount').value);
            formData.append('date', document.getElementById('date').value);
            formData.append('fileName', document.getElementById('fileName').value);

            try {
                const response = await fetch('/api/invoices', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('Invoice saved successfully!');
                    window.location.href = '/files';
                } else {
                    alert('Failed to save invoice.');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('An error occurred while saving.');
            }
        });
    </script>
</body>
</html>
